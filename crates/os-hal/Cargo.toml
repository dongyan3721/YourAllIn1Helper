[package]
name = "os-hal"
description = "Cross-platform OS Hardware Abstraction Layer (OS HAL) for Windows and macOS native capabilities."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
app-core = { path = "../app-core" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
tracing.workspace = true
chrono.workspace = true
enigo = "0.6.1"
xcap = "0.9.8"
image = "0.25"
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_System_WinRT",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_StationsAndDesktops",
    "Win32_System_RemoteDesktop",
    "Win32_System_Power",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    # WinRT 运行时类型：系统原生 OCR（Windows.Media.Ocr）与其图像/语言/异步依赖。
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }
# WinRT 异步操作句柄（IAsyncOperation/AsyncStatus）在 0.62 拆分到了独立 crate。
windows-future = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-audio = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"
# 登录钥匙串通用密码项（翻译 API Key 等凭据）；版本与 native-tls 已锁定的一致，无新增下载。
security-framework = "3.7"
# 系统原生 OCR（VNRecognizeTextRequest）；仅启用文字识别所需特性。
objc2-vision = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "VNObservation",
    "VNRecognizeTextRequest",
    "VNRequest",
    "VNRequestHandler",
    "VNTypes",
] }

[dev-dependencies]
tempfile = "3.10"
