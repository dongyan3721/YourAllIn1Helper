[workspace]
resolver = "2"
members = [
    "crates/app-core",
    "crates/os-hal",
    "crates/mod-screenshot",
    "crates/mod-clipboard",
    "crates/mod-screen-ink",
    "crates/mod-media-proc",
    "crates/mod-sticky-note",
    "crates/mod-window-pin",
    "crates/mod-script-runner",
    "crates/mod-app-usage",
    "crates/mod-translator",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["All-in-One Desktop Team"]
repository = "https://example.com/your_all_in_one"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "process", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
parking_lot = "0.12"
once_cell = "1.19"
sha2 = "0.10"
