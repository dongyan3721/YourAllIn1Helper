<!--
  全能桌面效率工具 (All-in-One Desktop Toolbox) 官方产品矢量 Logo
  原型来源：哆啦A梦口袋里的旋翼 gadget.png
  设计元素：哆啦A梦蓝底 + 四维百宝袋（内含缩小灯手电筒、金属圆环道具、绿色道具卡）+ 伸出的圆手紧握旋转竹蜻蜓 + 动态黄色闪光
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- 圆角应用图标裁剪蒙版 -->
    <clipPath id="app-icon-clip">
      <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" />
    </clipPath>

    <!-- 四维百宝袋开口内部道具裁剪区域（确保道具自然收纳在袋口内侧） -->
    <clipPath id="pocket-opening-clip">
      <path d="M 180 380 L 840 380 L 840 600 Q 506 620 180 600 Z" />
    </clipPath>

    <!-- 缩小灯手电筒筒身裁剪 -->
    <clipPath id="flashlight-body-clip">
      <path d="M 255 516 L 358 436 L 424 558 L 298 576 Z" />
    </clipPath>
  </defs>

  <g clip-path="url(#app-icon-clip)">
    <!-- 1. 哆啦A梦经典天蓝色背景 -->
    <rect x="0" y="0" width="1024" height="1024" fill="#0084FF" />

    <!-- 2. 右侧三枚黄色漫画动感闪光三角 -->
    <g fill="#FFE144">
      <!-- 左上闪光 -->
      <polygon points="688,448 708,354 738,376" />
      <!-- 中间主闪光 -->
      <polygon points="752,445 836,342 862,380" />
      <!-- 右下短闪光 -->
      <polygon points="786,466 846,444 846,492" />
    </g>

    <!-- 3. 四维百宝袋内部深色衬底（袋口暗部） -->
    <path
      d="M 216 526 C 340 560, 672 560, 796 526 L 770 595 L 242 595 Z"
      fill="#002259"
    />

    <!-- 4. 百宝袋内探出的四件道具（受袋口裁剪） -->
    <g clip-path="url(#pocket-opening-clip)">
      <!-- 4.1 中后方：竹蜻蜓在袋内的黄色底座延伸段 -->
      <path
        d="M 468 548 L 496 472 L 584 494 L 560 566 Z"
        fill="#FFE042"
        stroke="#002259"
        stroke-width="22"
        stroke-linejoin="round"
      />
      <path
        d="M 526 482 L 584 494 L 560 566 L 508 556 Z"
        fill="#F5B82E"
      />

      <!-- 4.2 左侧道具：红色缩小灯 / 探照手电筒 -->
      <g>
        <!-- 手电筒红色筒身与高光层 -->
        <g clip-path="url(#flashlight-body-clip)">
          <path d="M 250 516 L 362 432 L 428 560 L 296 580 Z" fill="#FF4B3E" />
          <!-- 筒身右侧暖粉高光带 -->
          <path d="M 332 452 L 362 432 L 424 554 L 388 562 Z" fill="#FF766B" />
          <!-- 筒身浅白反光条 -->
          <path d="M 346 462 L 360 452 L 384 498 L 368 508 Z" fill="#FFF6CC" opacity="0.85" />
        </g>
        <!-- 手电筒外轮廓与阶梯环线 -->
        <path
          d="M 255 516 L 358 436 L 392 496 L 404 510 L 420 556 L 298 576 Z"
          fill="none"
          stroke="#002259"
          stroke-width="22"
          stroke-linejoin="round"
        />
        <!-- 手电筒中部金属卡环弧线 -->
        <path
          d="M 318 570 C 352 558, 378 538, 396 504"
          fill="none"
          stroke="#002259"
          stroke-width="20"
          stroke-linecap="round"
        />
        <!-- 手电筒顶部倾斜米黄色发光镜面 -->
        <ellipse
          cx="306"
          cy="476"
          rx="64"
          ry="34"
          transform="rotate(-38 306 476)"
          fill="#FFF6CC"
          stroke="#002259"
          stroke-width="22"
        />
      </g>

      <!-- 4.3 中间道具：银灰色圆环仪表盘 -->
      <g>
        <circle
          cx="494"
          cy="576"
          r="82"
          fill="#D6DCE5"
          stroke="#002259"
          stroke-width="22"
        />
        <circle
          cx="494"
          cy="580"
          r="50"
          fill="#737A86"
          stroke="#002259"
          stroke-width="20"
        />
      </g>

      <!-- 4.4 右侧道具：翠绿色倾斜道具卡/通行证 -->
      <g>
        <!-- 外层翠绿机身 -->
        <path
          d="M 572 574 L 630 462 C 636 450, 648 446, 660 452 L 772 504 C 784 510, 788 522, 782 534 L 748 594 Z"
          fill="#39BF8A"
          stroke="#002259"
          stroke-width="22"
          stroke-linejoin="round"
        />
        <!-- 内层浅薄荷绿视窗 -->
        <path
          d="M 616 578 L 652 510 L 724 542 L 696 592 Z"
          fill="#9CE2C3"
          stroke="#002259"
          stroke-width="18"
          stroke-linejoin="round"
        />
      </g>
    </g>

    <!-- 5. 哆啦A梦四维百宝袋主体（下半部白色半圆碗状口袋） -->
    <g>
      <!-- 百宝袋纯白主体填充 -->
      <path
        d="M 212 534
           C 212 516, 228 514, 246 522
           C 340 568, 424 584, 506 584
           C 588 584, 672 568, 766 522
           C 784 514, 800 516, 800 534
           C 808 724, 674 868, 506 868
           C 338 868, 204 724, 212 534 Z"
        fill="#FFFFFF"
      />
      <!-- 百宝袋底部内侧立体浅灰阴影月牙 -->
      <path
        d="M 226 640
           C 258 784, 376 846, 506 846
           C 636 846, 754 784, 786 640
           C 766 798, 646 866, 506 866
           C 366 866, 246 798, 226 640 Z"
        fill="#DDE3EC"
      />
      <!-- 百宝袋外轮廓粗深蓝描边 -->
      <path
        d="M 212 534
           C 212 516, 228 514, 246 522
           C 340 568, 424 584, 506 584
           C 588 584, 672 568, 766 522
           C 784 514, 800 516, 800 534
           C 808 724, 674 868, 506 868
           C 338 868, 204 724, 212 534 Z"
        fill="none"
        stroke="#002259"
        stroke-width="24"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <!-- 百宝袋正面标志性 U 型内弧褶皱线 -->
      <path
        d="M 262 606
           C 286 786, 726 786, 750 606"
        fill="none"
        stroke="#002259"
        stroke-width="22"
        stroke-linecap="round"
      />
    </g>

    <!-- 6. 竹蜻蜓 / 旋翼 Gadget（握在圆手上方） -->
    <g>
      <!-- 6.1 竹蜻蜓倾斜立杆 -->
      <path
        d="M 594 334 L 648 242 L 684 264 L 630 356 Z"
        fill="#FFE042"
      />
      <!-- 立杆右侧金黄暗部 -->
      <path
        d="M 612 344 L 666 252 L 684 264 L 630 356 Z"
        fill="#F5B82E"
      />
      <path
        d="M 594 334 L 648 242 L 684 264 L 630 356 Z"
        fill="none"
        stroke="#002259"
        stroke-width="22"
        stroke-linejoin="round"
      />

      <!-- 6.2 左侧旋翼桨叶 -->
      <path
        d="M 648 214
           C 620 184, 574 162, 544 166
           C 526 168, 520 186, 530 202
           C 548 228, 602 252, 642 246 Z"
        fill="#FFE042"
      />
      <!-- 左桨叶下沿立体金黄阴影 -->
      <path
        d="M 530 198
           C 554 222, 604 242, 642 238
           L 642 248
           C 600 254, 546 230, 528 202 Z"
        fill="#F5B82E"
      />
      <!-- 左桨叶白色高光胶囊条与圆点 -->
      <path
        d="M 568 188 L 600 202"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="11"
        stroke-linecap="round"
      />
      <circle cx="552" cy="181" r="5.5" fill="#FFFFFF" />
      <!-- 左桨叶深蓝外轮廓 -->
      <path
        d="M 648 214
           C 620 184, 574 162, 544 166
           C 526 168, 520 186, 530 202
           C 548 228, 602 252, 642 246 Z"
        fill="none"
        stroke="#002259"
        stroke-width="22"
        stroke-linejoin="round"
      />

      <!-- 6.3 右侧旋翼桨叶 -->
      <path
        d="M 692 240
           C 732 246, 788 272, 808 300
           C 818 314, 808 332, 790 332
           C 758 332, 708 302, 682 270 Z"
        fill="#FFE042"
      />
      <!-- 右桨叶下沿立体金黄阴影 -->
      <path
        d="M 684 264
           C 712 294, 760 322, 794 322
           L 790 332
           C 756 332, 706 302, 680 270 Z"
        fill="#F5B82E"
      />
      <!-- 右桨叶白色高光胶囊条与圆点 -->
      <path
        d="M 744 278 L 774 296"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="11"
        stroke-linecap="round"
      />
      <circle cx="786" cy="304" r="5.5" fill="#FFFFFF" />
      <!-- 右桨叶深蓝外轮廓 -->
      <path
        d="M 692 240
           C 732 246, 788 272, 808 300
           C 818 314, 808 332, 790 332
           C 758 332, 708 302, 682 270 Z"
        fill="none"
        stroke="#002259"
        stroke-width="22"
        stroke-linejoin="round"
      />

      <!-- 6.4 竹蜻蜓中心圆球轴承 -->
      <circle
        cx="666"
        cy="238"
        r="33"
        fill="#FFE042"
        stroke="#002259"
        stroke-width="22"
      />
      <!-- 轴承右下方金黄弧形暗部 -->
      <path
        d="M 684 218 A 24 24 0 0 1 648 254 A 24 24 0 0 0 684 218 Z"
        fill="#F5B82E"
      />
    </g>

    <!-- 7. 哆啦A梦蓝色手臂与白色圆手（前景主视觉） -->
    <g>
      <!-- 7.1 蓝色手臂填充与轮廓（从左上伸向中央圆手） -->
      <path
        d="M 476 296
           C 412 254, 316 196, 232 188
           C 164 182, 138 228, 156 284
           C 180 356, 278 418, 404 426 Z"
        fill="#0084FF"
      />
      <!-- 手臂上沿粗深蓝轮廓 -->
      <path
        d="M 476 296
           C 412 254, 316 196, 232 188
           C 178 184, 148 210, 150 250"
        fill="none"
        stroke="#002259"
        stroke-width="22"
        stroke-linecap="round"
      />
      <!-- 手臂下沿粗深蓝轮廓 -->
      <path
        d="M 152 254
           C 162 338, 266 416, 404 426"
        fill="none"
        stroke="#002259"
        stroke-width="22"
        stroke-linecap="round"
      />

      <!-- 7.2 哆啦A梦白色圆手/拳头（握住竹蜻蜓） -->
      <path
        d="M 454 316
           C 484 282, 554 284, 594 318
           C 634 342, 654 384, 628 416
           C 626 456, 588 492, 526 490
           C 448 488, 396 438, 398 378
           C 398 344, 422 320, 454 316 Z"
        fill="#FFFFFF"
      />
      <!-- 圆手底部立体浅灰阴影 -->
      <path
        d="M 412 414
           C 438 462, 504 476, 566 468
           C 596 462, 616 442, 624 418
           C 618 462, 578 492, 522 490
           C 454 488, 412 454, 412 414 Z"
        fill="#DDE3EC"
      />
      <!-- 圆手外轮廓与手指关节弧线 -->
      <path
        d="M 454 316
           C 484 282, 554 284, 594 318
           C 634 342, 654 384, 628 416
           C 626 456, 588 492, 526 490
           C 448 488, 396 438, 398 378
           C 398 344, 422 320, 454 316 Z"
        fill="none"
        stroke="#002259"
        stroke-width="24"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <!-- 虎口/拇指内侧小折线 -->
      <path
        d="M 454 316 C 446 330, 442 342, 442 352"
        fill="none"
        stroke="#002259"
        stroke-width="20"
        stroke-linecap="round"
      />
      <!-- 右侧手指握拳折线 -->
      <path
        d="M 608 398 C 618 404, 624 410, 628 418"
        fill="none"
        stroke="#002259"
        stroke-width="20"
        stroke-linecap="round"
      />
    </g>
  </g>
</svg>
