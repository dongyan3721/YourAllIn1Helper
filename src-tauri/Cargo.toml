[package]
name = "all-in-one-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "all_in_one_host"
path = "src/lib.rs"

[[bin]]
name = "all-in-one-desktop"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
arboard = "3.7.0"
app-core = { path = "../crates/app-core" }
os-hal = { path = "../crates/os-hal" }
mod-screenshot = { path = "../crates/mod-screenshot" }
mod-clipboard = { path = "../crates/mod-clipboard" }
mod-screen-ink = { path = "../crates/mod-screen-ink" }
mod-media-proc = { path = "../crates/mod-media-proc" }
mod-sticky-note = { path = "../crates/mod-sticky-note" }
mod-window-pin = { path = "../crates/mod-window-pin" }
mod-script-runner = { path = "../crates/mod-script-runner" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSValue", "NSObject", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSGraphics", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.10"
